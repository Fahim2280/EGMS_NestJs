<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Electric Indigo (#4f46e5) to Vivid Cyan (#06b6d4) -->
    <linearGradient id="egmsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glass Inner Border -->
    <linearGradient id="egmsBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>

    <!-- Glow & Shadow Filter -->
    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#38bdf8" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#egmsGrad)" stroke="url(#egmsBorder)" stroke-width="12"/>

  <!-- Subtle Top Highlight Flare -->
  <ellipse cx="256" cy="110" rx="160" ry="60" fill="#ffffff" opacity="0.15"/>

  <!-- High-Precision Dynamic Electric Lightning Bolt (EGMS Signature) -->
  <path d="M 288 64 L 140 268 L 260 268 L 224 448 L 372 244 L 252 244 Z"
        fill="url(#boltGrad)"
        filter="url(#boltGlow)"
        stroke="#ffffff"
        stroke-width="3"
        stroke-linejoin="round"/>
</svg>
